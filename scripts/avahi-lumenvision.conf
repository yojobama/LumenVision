# avahi-daemon configuration for a LumenVision board, used instead of /etc/avahi/avahi-daemon.conf through a systemd override (installed by the
# lumenvision-backend .deb). It is the stock file with IPv6 publishing turned off: a board without IPv6 routing only has a link-local IPv6 address,
# and a browser that reaches lumenvision.local over it cannot open the WebRTC previews. Firefox then gathers its ICE candidates on IPv6 only,
# while the server (libjuice) never offers link-local addresses, so the two sides have no address pair and the preview falls back to MJPEG.
[server]
use-ipv4=yes
use-ipv6=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-aaaa-on-ipv4=no
publish-hinfo=no
publish-workstation=no

[reflector]

[rlimits]
