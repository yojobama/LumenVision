name: Release

# Builds the backend .deb, board images and the photoncompat vendordep, and publishes them to a
# GitHub Release on a pushed version tag. A workflow_dispatch run builds and uploads artifacts only;
# publish-release runs only for a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-arm64:
    # GitHub-hosted arm64 runner
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # From-source OpenCV/ffmpeg-rockchip/MPP builds are slow, so cache them
      - name: Cache dependency build
        uses: actions/cache@v4
        with:
          path: |
            ~/.lumen-build
            /usr/local/include
            /usr/local/lib
            /usr/local/bin
            /opt/lumenvision-ffmpeg
          key: lumen-deps-linux-arm64-${{ hashFiles('scripts/install-deps.sh', 'third_party/vkapriltag/apriltags_vulkan/library/**', 'third_party/vkapriltag/apriltags_vulkan/cmake/patches/*') }}
          restore-keys: |
            lumen-deps-linux-arm64-

      - name: Install/build dependencies
        run: ./scripts/install-deps.sh --with-nt4 --with-webrtc --with-rknn --with-mpp --with-ffmpeg-rockchip

      - name: Configure
        run: cmake --preset ci-linux-arm64

      - name: Build
        run: cmake --build --preset ci-linux-arm64

      - name: Test
        run: ctest --preset ci-linux-arm64 --output-on-failure

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
          # Must match the preset used by the Configure/Build/Test steps above
          LUMEN_CORE_PRESET: ci-linux-arm64
        run: ./scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lumenvision-backend-deb
          path: lumenvision-backend_*_arm64.deb
          if-no-files-found: error

  build-deb-x64:
    # Plain x64 package with no Rockchip components; same dependency flags and preset as ci.yml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Same cache key as ci.yml's x64 job (same dependency set)
      - name: Cache dependency build
        uses: actions/cache@v4
        with:
          path: |
            ~/.lumen-build
            /usr/local/include
            /usr/local/lib
            /usr/local/bin
          key: lumen-deps-linux-x64-${{ hashFiles('scripts/install-deps.sh', 'third_party/vkapriltag/apriltags_vulkan/library/**', 'third_party/vkapriltag/apriltags_vulkan/cmake/patches/*') }}
          restore-keys: |
            lumen-deps-linux-x64-

      - name: Install/build dependencies
        run: ./scripts/install-deps.sh --with-nt4 --with-webrtc

      - name: Configure
        run: cmake --preset ci-linux-x64

      - name: Build
        run: cmake --build --preset ci-linux-x64

      - name: Test
        run: ctest --preset ci-linux-x64 --output-on-failure

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
          # Must match the preset used by the Configure/Build/Test steps above
          LUMEN_CORE_PRESET: ci-linux-x64
        run: ./scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lumenvision-backend-deb-amd64
          path: lumenvision-backend_*_amd64.deb
          if-no-files-found: error

  build-images:
    # One flashable OS image per Orange Pi 5-family board, built from the arm64 .deb (see
    # scripts/build-image.sh); every board image gates the release
    needs: build-deb-arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        board: [orangepi5, orangepi5-plus, orangepi5b, orangepi5pro, orangepi5-max, orangepi5-ultra]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lumenvision-backend-deb
          path: .

      - name: Build image
        env:
          VERSION: ${{ needs.build-deb-arm64.outputs.version }}
        # --preserve-env because sudo's env_reset drops a leading VAR=value assignment
        run: sudo --preserve-env=VERSION scripts/build-image.sh ${{ matrix.board }}

      - uses: actions/upload-artifact@v4
        with:
          name: lumenvision-image-${{ matrix.board }}
          path: lumenvision-${{ matrix.board }}_*.img.xz
          if-no-files-found: error

  build-vendordep:
    # Pure Java; no native toolchain needed
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and publish photoncompat
        working-directory: photoncompat
        run: ./gradlew publish -PphotoncompatVersion=${{ steps.version.outputs.value }}

      - name: Render vendordep JSON
        run: |
          sed "s/__VERSION__/${{ steps.version.outputs.value }}/g" \
            photoncompat/vendordep-template.json > photoncompat.json

      - uses: actions/upload-artifact@v4
        with:
          name: photoncompat-maven-repo
          path: photoncompat/build/maven-repo

      - uses: actions/upload-artifact@v4
        with:
          name: photoncompat-vendordep-json
          path: photoncompat.json

  publish-release:
    needs: [build-deb-arm64, build-deb-x64, build-images, build-vendordep]
    runs-on: ubuntu-24.04
    # Only a pushed tag publishes a release
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lumenvision-backend-deb
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: lumenvision-backend-deb-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: lumenvision-image-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: photoncompat-vendordep-json
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: photoncompat-maven-repo
          path: maven-repo

      - name: Publish Maven artifacts to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: maven-repo
          destination_dir: maven
          # Keep earlier releases resolvable for robot projects pinned to older versions
          keep_files: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/lumenvision-backend_*_arm64.deb \
            dist/lumenvision-backend_*_amd64.deb \
            dist/lumenvision-*.img.xz \
            dist/photoncompat.json \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
