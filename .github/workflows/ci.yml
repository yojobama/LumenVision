name: CI

# Linux x64 build and test on every push; the ARM64 build and .deb package are in release.yml
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # install-deps.sh skips dependencies already present, so a cache hit avoids the from-source
      # build; keyed on the script contents
      - name: Cache dependency build
        uses: actions/cache@v4
        with:
          path: |
            ~/.lumen-build
            /usr/local/include
            /usr/local/lib
            /usr/local/bin
          key: lumen-deps-linux-x64-${{ hashFiles('scripts/install-deps.sh', 'third_party/vkapriltag/apriltags_vulkan/library/**', 'third_party/vkapriltag/apriltags_vulkan/cmake/patches/*') }}
          restore-keys: |
            lumen-deps-linux-x64-

      - name: Install/build dependencies
        run: ./scripts/install-deps.sh --with-nt4 --with-webrtc

      - name: Configure
        run: cmake --preset ci-linux-x64

      - name: Build
        run: cmake --build --preset ci-linux-x64

      # --output-on-failure prints why a test failed
      - name: Test
        run: ctest --preset ci-linux-x64 --output-on-failure

      # Builds the C# Server against the native library produced above (-c Release matches its
      # stage/Release output directory)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Server
        run: dotnet build Server/Server.csproj -c Release -p:LumenCorePreset=ci-linux-x64
