// org.lumenvision:photoncompat-java - NT4 client library robot code uses to read a LumenVision
// coprocessor's AprilTag/object-detection results. A plain java-library module (not GradleRIO),
// published as an FRC vendor library (photoncompat/vendordep-template.json); robot/ consumes it via
// robot/vendordeps/photoncompat.json.
plugins {
    id "java-library"
    id "maven-publish"
}

group = "org.lumenvision"
// Set with `-PphotoncompatVersion=X.Y.Z` in release builds; local builds get a placeholder
version = project.hasProperty("photoncompatVersion") ? project.photoncompatVersion : "0.0.0-local"

// Baked into the jar so LumenVersionCheck can compare it with the coprocessor's ".version" NT4 topic;
// the resource file is a template whose ${version} is expanded here
processResources {
    filesMatching("photoncompat-version.properties") {
        expand(version: project.version.toString())
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://frcmaven.wpi.edu/artifactory/release/" }
}

// Must match the GradleRIO version in robot/.wpilib/wpilib_preferences.json
ext.wpilibVersion = "2026.2.1"

// WPILib's native artifact classifier for the machine running the tests
def osName = System.getProperty("os.name").toLowerCase()
ext.nativeClassifier = osName.contains("win") ? "windowsx86-64"
        : osName.contains("mac") ? "osxuniversal"
        : (System.getProperty("os.arch") == "aarch64" ? "linuxarm64" : "linuxx86-64")

configurations {
    testNatives
}

dependencies {
    // WPILib's published POMs declare no dependencies, so each artifact is listed explicitly.
    // api: the public API exposes WPIMath geometry and NetworkTables types to consumers.
    api "edu.wpi.first.wpimath:wpimath-java:${wpilibVersion}"
    api "edu.wpi.first.ntcore:ntcore-java:${wpilibVersion}"
    // AprilTagFieldLayout, which the pose estimator takes (pure Java: its detector JNI is not loaded)
    api "edu.wpi.first.apriltag:apriltag-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:${wpilibVersion}"
    // DriverStation.reportWarning is used by LumenVersionCheck; implementation since it is not in the public API
    implementation "edu.wpi.first.wpilibj:wpilibj-java:${wpilibVersion}"
    // wpimath classes reference edu.wpi.first.units.measure types, which javac must resolve
    implementation "edu.wpi.first.wpiunits:wpiunits-java:${wpilibVersion}"
    implementation "org.ejml:ejml-simple:0.44.0"
    // Needed at runtime by wpimath (Jackson annotations) and by ntcore's RuntimeLoader (jackson-core TypeReference)
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-core:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.19.2"
    // Translation2d/Translation3d static initialisers build a QuickBuffers protobuf schema
    implementation "us.hebi.quickbuf:quickbuf-runtime:1.4"

    // A live NetworkTableInstance in tests needs ntcore's JNI libraries, which WPILib ships inside the native zips
    testNatives "edu.wpi.first.ntcore:ntcore-cpp:${wpilibVersion}:${nativeClassifier}@zip"
    testNatives "edu.wpi.first.wpinet:wpinet-cpp:${wpilibVersion}:${nativeClassifier}@zip"
    testNatives "edu.wpi.first.wpiutil:wpiutil-cpp:${wpilibVersion}:${nativeClassifier}@zip"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Flattens the shared libraries out of the native zips for the test JVM's java.library.path
tasks.register("unpackTestNatives", Copy) {
    from { configurations.testNatives.collect { zipTree(it) } }
    include "**/*.dll", "**/*.so", "**/*.so.*", "**/*.dylib"
    exclude "**/*static*/**", "**/*debug*/**"
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir("test-natives")
}

test {
    useJUnitPlatform()
    dependsOn "unpackTestNatives"
    systemProperty "java.library.path", layout.buildDirectory.dir("test-natives").get().asFile.absolutePath
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = "photoncompat-java"
        }
    }
    repositories {
        // Local repository; CI copies it into gh-pages (see .github/workflows/release.yml)
        maven {
            name = "local"
            url = layout.buildDirectory.dir("maven-repo")
        }
    }
}

// Renders vendordep-template.json for a local build and copies it into robot/vendordeps, so the example robot (or any GradleRIO
// project pointed at the same file) resolves photoncompat from this checkout's build/maven-repo instead of a release.
tasks.register("installIntoRobot") {
    dependsOn "publishMavenPublicationToLocalRepository"
    def template = file("vendordep-template.json")
    def repoUrl = layout.buildDirectory.dir("maven-repo").get().asFile.toURI().toString()
    def target = file("../robot/vendordeps/photoncompat.json")
    doLast {
        def json = template.text
                .replace("https://yojobama.github.io/LumenVision/maven", repoUrl)
                .replace("__VERSION__", project.version.toString())
        target.text = json
        println "Wrote ${target}"
    }
}
